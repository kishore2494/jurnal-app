<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google-site-verification" content="NaRi1JakGHS3tfXnr7RHgNQvOsiUf2EZ5HSnGn1fLYs">
  <meta name="theme-color" content="#f4f6fb">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daylog">
  <title>Daylog</title>
  <!-- This URL — the app root — is the one most likely to be shared, and it had no description
       and no Open Graph tags at all, so every share of Daylog itself rendered as a bare title.
       The landing pages had them; the app did not. -->
  <meta name="description" content="A private, offline life tracker: habits, mood, 24-hour time tracking, gym, journal and focus timers. Your data stays on your device.">
  <link rel="canonical" href="https://kishore2494.github.io/daily-pulse/">
  <meta property="og:site_name" content="Daylog">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kishore2494.github.io/daily-pulse/">
  <meta property="og:title" content="Daylog — private, offline life tracker">
  <meta property="og:description" content="A private, offline life tracker: habits, mood, 24-hour time tracking, gym, journal and focus timers. Your data stays on your device.">
  <meta property="og:image" content="https://kishore2494.github.io/daily-pulse/og-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Daylog — private, offline life tracker">
  <meta name="twitter:description" content="A private, offline life tracker: habits, mood, 24-hour time tracking, gym, journal and focus timers. Your data stays on your device.">
  <meta name="twitter:image" content="https://kishore2494.github.io/daily-pulse/og-card.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Fonts are SELF-HOSTED. They used to come from fonts.googleapis.com on every launch,
       which sent this user's IP and User-Agent to Google each time an app that advertises
       itself as "private & offline" was opened — and the service worker deliberately skips
       cross-origin requests, so a genuinely offline first launch got no custom fonts at all.
       DM Sans and Sora are variable fonts, so one file per family covers every weight: 92 KB
       for both, latin subset. jsPDF was already vendored in libs/, so this matches. -->
  <style>
    @font-face { font-family: 'DM Sans'; font-style: normal; font-weight: 400 700;
      font-display: swap; src: url('./fonts/self/dm-sans.woff2') format('woff2'); }
    @font-face { font-family: 'Sora'; font-style: normal; font-weight: 600 800;
      font-display: swap; src: url('./fonts/self/sora.woff2') format('woff2'); }
  </style>
  <link rel="stylesheet" href="styles.css?v=251">
  <script src="libs/jspdf.min.js" defer></script>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="topbar-l">
        <button class="nav-back" id="nav-back" aria-label="Open menu" hidden>‹ Menu</button>
        <h1 id="screen-title">Today</h1>
        <div class="sub" id="screen-sub">—</div>
      </div>
      <div class="streak-badge" id="streak-badge">🔥 <span id="streak-n">0</span></div>
    </div>

    <!-- ============ TODAY / LOG ============ -->
    <section class="screen on" id="s-today"></section>

    <!-- ============ TIME (24h activity tracker) ============ -->
    <section class="screen" id="s-time"></section>

    <!-- ============ TASKS ============ -->
    <section class="screen" id="s-tasks"></section>

    <!-- ============ NOTES ============ -->
    <section class="screen" id="s-notes"></section>

    <!-- ============ PLANS ============ -->
    <section class="screen" id="s-plans"></section>
    <section class="screen" id="s-projects"></section>
    <section class="screen" id="s-money"></section>
    <section class="screen" id="s-ask"></section>

    <!-- ============ GYM ============ -->
    <section class="screen" id="s-gym"></section>

    <!-- ============ HABITS ============ -->
    <section class="screen" id="s-habits"></section>

    <!-- ============ DASHBOARD ============ -->
    <section class="screen" id="s-dash"></section>

    <!-- ============ WRITE (inner blog) ============ -->
    <section class="screen" id="s-write"></section>

    <!-- ============ MORE (overflow launcher) ============ -->
    <section class="screen" id="s-more"></section>

    <!-- ============ CUSTOMIZE ============ -->
    <section class="screen" id="s-custom"></section>

    <!-- ============ FOCUS (Pomodoro + Timebox) ============ -->
    <section class="screen" id="s-focus"></section>

    <!-- ============ WAVES (binaural beats) ============ -->
    <section class="screen" id="s-waves"></section>

    <!-- ============ CALENDAR ============ -->
    <section class="screen" id="s-cal"></section>

    <!-- ============ SEARCH ============ -->
    <section class="screen" id="s-search"></section>

    <!-- ============ HISTORY ============ -->
    <section class="screen" id="s-awards"></section>
    <section class="screen" id="s-history"></section>

    <!-- ============ SETTINGS ============ -->
    <section class="screen" id="s-settings"></section>
  </div>

  <nav class="nav" id="nav">
    <button data-screen="today" class="on"><span class="ico">📝</span>Log</button>
    <button data-screen="time"><span class="ico">⏱️</span>Time</button>
    <button data-screen="focus"><span class="ico">🍅</span>Focus</button>
    <button data-screen="dash"><span class="ico">📊</span>Stats</button>
    <button data-screen="__menu"><span class="ico">☰</span>Menu</button>
  </nav>

  <!-- Side navigation drawer (everything, one tap away) -->
  <div class="drawer-scrim" id="drawer-scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <img class="drawer-logo" src="icons/icon-192.png" alt="" width="44" height="44">
      <div class="drawer-brand"><span class="drawer-title">Daylog</span><span class="drawer-sub" id="drawer-sub"></span></div>
      <button class="drawer-x" id="drawer-close" aria-label="Close menu">✕</button>
    </div>
    <nav class="drawer-list" id="drawer-list"></nav>
    <div class="drawer-foot" id="drawer-foot"></div>
  </aside>

  <div class="alarm-overlay" id="alarm">
    <div class="alarm-bell">⏰</div>
    <div class="alarm-label" id="alarm-label"></div>
    <div class="alarm-sub" id="alarm-sub"></div>
    <div class="alarm-btns">
      <button class="btn btn-primary" id="alarm-dismiss">Dismiss</button>
      <button class="btn btn-ghost" id="alarm-snooze">Snooze 5 min</button>
    </div>
  </div>

  <div class="onboard" id="onboard"></div>
  <div id="print-report"></div>

  <div class="toast" id="toast"></div>
  <script src="workout-anims.js?v=251"></script>
  <script src="workout-plan.js?v=251"></script>
  <script src="app.js?v=251"></script>
</body>
</html>
